name: enso
description: "A calm day planner that builds your whole day from the moment you wake."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  path_parsing: ^1.1.0
  timezone: ^0.11.2
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/demo/
    - assets/backgrounds/
    - assets/prompts/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
